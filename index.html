<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Trening</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trening">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d0c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-apple.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0d0c;
  --bg1:#131312;
  --bg2:#181817;
  --rule:#252523;
  --rule2:#2e2e2c;
  --text:#f0ede8;
  --text2:#9c9890;
  --text3:#4a4a47;
  --amber:#e8960c;
  --amber-dim:rgba(232,150,12,0.12);
  --amber-faint:rgba(232,150,12,0.06);
  --done-line:rgba(232,150,12,0.3);
  --skip:#3a3a38;
  --blue:#6b9fd4;
  --blue-dim:rgba(107,159,212,0.10);
  --breath:#c49a52;
  --green-dim:rgba(196,154,82,0.12);
  --warn:#c4543a;
}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Outfit',sans-serif;
  font-weight:300;
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:480px;margin:0 auto;padding-bottom:120px}

/* ── HEADER ── */
.header{padding:52px 24px 32px}
.header-eye{
  font-size:10px;letter-spacing:4px;text-transform:uppercase;
  color:var(--text3);margin-bottom:14px;font-weight:500;
}
.header-title{
  font-size:46px;font-weight:700;line-height:1.0;
  letter-spacing:-2px;color:var(--text);
}
.header-title em{font-style:normal;color:var(--amber)}
.header-date{font-size:12px;color:var(--text3);margin-top:20px;font-weight:300}

/* ── NAV ── */
.nav{
  display:flex;
  border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule);
  position:sticky;top:0;z-index:50;
  background:rgba(13,13,12,0.95);
  backdrop-filter:blur(20px);
}
.nav-btn{
  flex:1;background:none;border:none;
  padding:15px 0;
  font-family:'Outfit',sans-serif;
  font-size:11px;font-weight:500;letter-spacing:2.5px;
  text-transform:uppercase;color:var(--text3);
  cursor:pointer;transition:color .2s;position:relative;
}
.nav-btn::after{
  content:'';position:absolute;bottom:-1px;
  left:0;right:0;height:1px;background:var(--amber);
  transform:scaleX(0);transition:transform .2s ease;
}
.nav-btn.active{color:var(--text)}
.nav-btn.active::after{transform:scaleX(1)}

/* ── PAGES ── */
.page{display:none;padding:32px 24px 0;animation:rise .2s ease}
.page.active{display:block}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ── QUOTE ── */
.quote-wrap{
  padding:28px 0 28px;
  border-bottom:1px solid var(--rule);
  margin-bottom:36px;
  cursor:pointer;position:relative;
}
.quote-text{
  font-size:16px;font-weight:300;font-style:italic;
  line-height:1.7;color:var(--text2);
  transition:opacity .2s;padding-right:24px;
}
.quote-source{
  font-size:11px;font-weight:500;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--text3);
  margin-top:12px;
}
.quote-cycle{
  position:absolute;top:28px;right:0;
  font-size:16px;color:var(--text3);
  transition:color .2s,transform .35s ease;
}
.quote-wrap:hover .quote-cycle{color:var(--amber);transform:rotate(180deg)}

/* ── HOME STATS ── */
.stats-row{
  display:flex;gap:0;
  border-bottom:1px solid var(--rule);
  margin-bottom:0;
}
.stat-cell{flex:1;padding:20px 0 20px}
.stat-cell:first-child{border-right:1px solid var(--rule)}
.stat-cell:first-child{padding-right:24px}
.stat-cell:last-child{padding-left:24px}
.stat-label{
  font-size:10px;font-weight:500;letter-spacing:2.5px;
  text-transform:uppercase;color:var(--text3);margin-bottom:8px;
}
.stat-num{
  font-size:42px;font-weight:700;letter-spacing:-2px;
  color:var(--amber);line-height:1;
  cursor:pointer;display:inline-block;
  border-bottom:1px solid transparent;
  transition:border-color .2s;
}
.stat-num:hover{border-bottom-color:var(--amber)}
.stat-num-inp{
  font-size:42px;font-weight:700;letter-spacing:-2px;
  color:var(--amber);line-height:1;
  background:none;border:none;
  border-bottom:1px solid var(--amber);
  outline:none;width:80px;
  font-family:'Outfit',sans-serif;
  -moz-appearance:textfield;
}
.stat-num-inp::-webkit-inner-spin-button,
.stat-num-inp::-webkit-outer-spin-button{-webkit-appearance:none}
.stat-unit{font-size:12px;color:var(--text3);margin-top:4px;font-weight:300}

.weight-row{
  border-bottom:1px solid var(--rule);
  padding:20px 0;
  display:flex;align-items:baseline;gap:10px;
  flex-wrap:wrap;margin-bottom:36px;
}
.weight-label{
  font-size:10px;font-weight:500;letter-spacing:2.5px;
  text-transform:uppercase;color:var(--text3);
}
.weight-inp{
  background:none;border:none;
  border-bottom:1px solid var(--rule2);
  font-family:'Outfit',sans-serif;
  font-size:28px;font-weight:600;
  color:var(--text);width:60px;text-align:center;
  outline:none;padding:0 2px;
  transition:border-color .2s;
}
.weight-inp:focus{border-bottom-color:var(--amber)}
.weight-unit{font-size:12px;color:var(--text3);font-weight:300}
.weight-gap{font-size:12px;color:var(--amber);margin-left:auto;font-weight:500}
.weight-goal{font-size:11px;color:var(--text3);font-weight:300}

.last-sess{padding:0}
.last-label{
  font-size:10px;font-weight:500;letter-spacing:2.5px;
  text-transform:uppercase;color:var(--text3);margin-bottom:10px;
}
.last-body{font-size:14px;color:var(--text2);line-height:1.7;font-weight:300}
.last-body strong{color:var(--text);font-weight:600}

/* ── SESSION TABS ── */
.sess-tabs{
  display:flex;
  border-bottom:1px solid var(--rule);
  margin-bottom:32px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.sess-tabs::-webkit-scrollbar{display:none}
.sess-tab{
  flex:1;min-width:0;
  background:none;border:none;border-right:1px solid var(--rule);
  padding:14px 10px;cursor:pointer;text-align:left;
  transition:background .15s;position:relative;
  white-space:nowrap;
}
.sess-tab:last-child{border-right:none}
.sess-tab::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:var(--amber);transform:scaleX(0);
  transition:transform .2s;transform-origin:left;
}
.sess-tab.active::after{transform:scaleX(1)}
.stab-name{font-size:12px;font-weight:600;color:var(--text);margin-bottom:2px;letter-spacing:-0.3px}
.stab-sub{font-size:10px;color:var(--text3);font-weight:300}

/* ── CHECK-IN ── */
.checkin-wrap{margin-bottom:28px}
.checkin-head{
  display:flex;align-items:center;gap:8px;
  margin-bottom:10px;
}
.checkin-dot{width:5px;height:5px;border-radius:50%;background:var(--amber);flex-shrink:0}
.checkin-title{
  font-size:10px;font-weight:500;letter-spacing:2.5px;
  text-transform:uppercase;color:var(--text2);
}
.checkin-hint{font-size:11px;color:var(--text3);margin-left:auto;font-style:italic;font-weight:300}
.checkin-prompts{font-size:11px;color:var(--text3);margin-bottom:8px;font-weight:300}
.checkin-area{
  width:100%;background:var(--bg1);
  border:none;border-bottom:1px solid var(--rule2);
  padding:10px 0;
  font-family:'Outfit',sans-serif;font-size:13px;font-weight:300;
  color:var(--text);resize:none;outline:none;
  line-height:1.6;min-height:56px;
  transition:border-color .2s;
}
.checkin-area:focus{border-bottom-color:var(--amber)}
.checkin-area::placeholder{color:var(--text3);font-style:italic}

/* ── BLOCK SECTION ── */
.block-sec{margin-bottom:32px}
.block-title{
  font-size:12px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;color:var(--text);
  padding-bottom:12px;
  border-bottom:1px solid var(--rule);
  margin-bottom:0;
}

/* SUPERSET */
.superset-wrap{position:relative;padding-left:12px}
.superset-wrap::before{
  content:'';position:absolute;left:0;top:0;bottom:0;
  width:1px;background:var(--amber);opacity:0.25;
}
.superset-tag{
  font-size:10px;font-weight:600;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--text2);
  padding:8px 0 8px;border-bottom:1px solid var(--rule);
  display:block;
}

/* ── EXERCISE ROW — no box, just lines ── */
.ex-row{
  border-bottom:1px solid var(--rule);
  overflow:hidden;
  transition:background .2s;
  position:relative;
}
.ex-row.done{background:var(--amber-faint)}
.ex-row.done::before{
  content:'';position:absolute;left:0;top:0;bottom:0;
  width:2px;background:var(--amber);opacity:0.5;
}
.ex-row.skipped{opacity:0.45}
.ex-row.skipped .ex-row-name{text-decoration:line-through;color:var(--text3)}

.ex-row-head{
  display:flex;align-items:center;
  padding:14px 0;gap:12px;
  cursor:pointer;user-select:none;
}
.ex-row-check{
  width:20px;height:20px;border-radius:50%;
  border:1.5px solid var(--rule2);
  flex-shrink:0;display:flex;align-items:center;
  justify-content:center;
  transition:all .2s;font-size:10px;color:transparent;
}
.ex-row.done .ex-row-check{
  background:var(--amber);border-color:var(--amber);
  color:var(--bg);font-weight:700;
}
.ex-row.skipped .ex-row-check{
  border-color:var(--skip);color:var(--text3);font-size:11px;
}
.ex-row-info{flex:1;min-width:0}
.ex-row-name{
  font-size:15px;font-weight:500;color:var(--text);
  letter-spacing:-0.2px;
}
.ex-row-presc{font-size:12px;color:var(--text3);margin-top:2px;font-weight:300}
.tags{display:flex;gap:4px;flex-shrink:0}
.ex-tag{
  font-size:9px;font-weight:500;letter-spacing:1px;
  text-transform:uppercase;padding:2px 6px;
}
.ex-tag-rehab{color:var(--blue);background:var(--blue-dim);border:1px solid rgba(107,159,212,0.3);border-radius:3px;font-size:9px;font-weight:600;letter-spacing:1px;padding:3px 7px;text-transform:uppercase}
.ex-tag-breath{color:var(--breath);background:var(--breath-dim);border:1px solid rgba(196,154,82,0.35);border-radius:3px;font-size:9px;font-weight:600;letter-spacing:1px;padding:3px 7px;text-transform:uppercase}
.ex-row-summary{
  font-size:14px;font-weight:600;color:var(--amber);
  white-space:nowrap;flex-shrink:0;
}
.skip-btn{
  width:24px;height:24px;
  background:none;border:1px solid var(--rule2);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:11px;color:var(--text3);
  transition:all .2s;flex-shrink:0;
}
.skip-btn:hover{border-color:var(--text2);color:var(--text2)}
.ex-row.skipped .skip-btn{border-color:var(--skip);color:var(--text3)}

.ex-row-body{padding:0 4px 16px}

/* PREV SESSION */
.prev-block{
  padding:10px 0;
  border-bottom:1px solid var(--rule);
  margin-bottom:2px;
}
.prev-label{
  font-size:9px;font-weight:500;letter-spacing:2px;
  text-transform:uppercase;color:var(--text3);margin-bottom:6px;
}
.prev-chips{display:flex;gap:4px;flex-wrap:wrap}
.prev-chip{
  font-size:11px;font-weight:300;color:var(--text2);
  background:var(--bg2);padding:3px 8px;
  border:1px solid var(--rule);
}
.prev-note{
  font-size:11px;font-weight:300;color:var(--text2);
  font-style:italic;margin-top:6px;line-height:1.5;
}

/* ABBY NOTE */
.abby-note{
  margin:8px 0;padding:9px 12px;
  border-left:2px solid var(--breath);
  background:var(--breath-dim);
  font-size:13px;font-weight:300;color:var(--text2);
  font-style:italic;line-height:1.6;
}
.abby-note-label{
  font-size:10px;font-weight:600;letter-spacing:0.5px;
  text-transform:none;color:var(--breath);
  font-style:normal;margin-right:4px;
}
.abby-note-text{
  font-size:13px;font-weight:300;color:var(--text2);
  font-style:italic;line-height:1.6;
}

/* WARMUP SET */
.wu-set-row{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 0;border-bottom:1px solid var(--rule);
}
.wu-set-cb{
  width:16px;height:16px;
  border:1.5px solid var(--rule2);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;
  font-size:9px;color:transparent;flex-shrink:0;
  margin-top:2px;
}
.wu-set-cb.checked{background:var(--amber);border-color:var(--amber);color:var(--bg);font-weight:700}
.wu-set-label{font-size:12px;color:var(--text2);flex:1;font-weight:300;line-height:1.5}
.wu-set-weight{font-size:11px;color:var(--text3);font-weight:300;flex-shrink:0;margin-top:2px}

/* SETS */
.sets-label{
  font-size:10px;font-weight:600;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--text2);
  margin:12px 0 6px;display:block;
}
.sets-list{display:flex;flex-direction:column;gap:0;margin-bottom:10px}
.set-row{
  display:flex;align-items:center;gap:8px;
  padding:13px 0;
  border-bottom:1px solid var(--rule);
  transition:all .15s;
}
.set-row:last-child{border-bottom:none}
.set-row.set-logged{border-bottom-color:var(--done-line)}
.set-row.set-logged .set-n{color:var(--amber)}
.set-row.set-logged .set-val{color:var(--amber)}
.set-n{
  font-size:11px;font-weight:500;letter-spacing:1px;
  color:var(--text3);width:24px;flex-shrink:0;
}
.set-ctrl{display:flex;align-items:center;gap:6px;flex:1}
.set-group{
  display:flex;align-items:center;
  flex-shrink:1;
}
.set-btn{
  width:22px;height:28px;background:none;border:none;
  font-size:17px;font-weight:200;color:var(--text3);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:color .15s;flex-shrink:0;
}
.set-btn:hover{color:var(--amber)}
.set-btn:active{transform:scale(.88)}
.set-val{
  font-size:20px;font-weight:600;color:var(--text);
  min-width:28px;max-width:44px;text-align:center;line-height:28px;
  cursor:text;letter-spacing:-0.5px;
}
.set-val-inp{
  font-size:18px;font-weight:500;color:var(--amber);
  background:transparent;border:none;
  border-bottom:1px solid var(--amber);
  outline:none;width:38px;text-align:center;
  line-height:32px;padding:0;
  font-family:'Outfit',sans-serif;
  -moz-appearance:textfield;
}
.set-val-inp::-webkit-inner-spin-button,
.set-val-inp::-webkit-outer-spin-button{-webkit-appearance:none}
.set-unit{font-size:11px;color:var(--text2);margin-right:4px;font-weight:300}
.set-sep{font-size:12px;color:var(--rule2);padding:0 2px}
.log-btn{
  padding:0 12px;height:28px;
  background:var(--amber);border:none;
  color:var(--bg);
  font-family:'Outfit',sans-serif;
  font-size:10px;font-weight:600;letter-spacing:1.5px;
  text-transform:uppercase;cursor:pointer;flex-shrink:0;
  transition:opacity .15s;
}
.log-btn:hover{opacity:.8}
.set-row.set-logged .log-btn{
  background:transparent;border:none;
  color:var(--amber);font-size:18px;font-weight:300;
  letter-spacing:0;padding:0 4px;
}

/* NOTE */
.note-label{
  font-size:9px;font-weight:500;letter-spacing:2px;
  text-transform:uppercase;color:var(--text3);margin-bottom:5px;
  display:block;
}
.note-inp{
  width:100%;background:none;border:none;
  border-bottom:1px solid var(--rule);
  padding:6px 0;
  font-family:'Outfit',sans-serif;font-size:13px;font-weight:300;
  color:var(--text);resize:none;outline:none;
  line-height:1.6;min-height:34px;
  transition:border-color .2s;
}
.note-inp:focus{border-bottom-color:var(--amber)}
.note-inp::placeholder{color:var(--text3);font-style:italic}
.coach-note{
  font-size:12px;font-weight:300;color:var(--text2);
  font-style:italic;margin-top:10px;line-height:1.6;
  padding-left:10px;border-left:1px solid var(--rule2);
}

/* WARMUP CARD */
.wu-card{
  border-bottom:1px solid var(--rule);
  overflow:hidden;transition:background .2s;position:relative;
}
.wu-card.done{background:var(--amber-faint)}
.wu-card.done::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--amber);opacity:.5}
.wu-head{display:flex;align-items:center;padding:14px 0;gap:12px}
.wu-title{font-size:14px;font-weight:500;color:var(--text);flex:1}
.wu-body{padding:0 0 12px}
.wu-metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:12px 0}
.wu-metric{display:flex;flex-direction:column;align-items:center;gap:4px}
.wu-metric-lbl{
  font-size:9px;font-weight:500;letter-spacing:2px;
  text-transform:uppercase;color:var(--text3);
}
.wu-stepper{
  display:flex;align-items:center;
  border:1px solid var(--rule2);background:var(--bg1);width:100%;
}
.wu-step-btn{
  width:28px;height:34px;background:none;border:none;
  font-size:15px;font-weight:200;color:var(--text3);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:color .15s,background .15s;
}
.wu-step-btn:hover{color:var(--amber);background:var(--amber-dim)}
.wu-step-val{
  font-size:16px;font-weight:500;color:var(--text);
  flex:1;text-align:center;line-height:34px;
}
.wu-metric-unit{font-size:9px;color:var(--text3);font-weight:300}
.wu-done-btn{
  width:100%;padding:10px;
  background:var(--amber);border:none;color:var(--bg);
  font-family:'Outfit',sans-serif;
  font-size:10px;font-weight:600;letter-spacing:2px;
  text-transform:uppercase;cursor:pointer;transition:opacity .15s;
}
.wu-done-btn:hover{opacity:.8}
.wu-done-btn.done-state{
  background:transparent;border:1px solid var(--done-line);color:var(--amber);
}

/* CHECKBOX */
.cb-row{
  display:flex;align-items:center;gap:12px;
  padding:12px 0;border-bottom:1px solid var(--rule);
  cursor:pointer;user-select:none;transition:opacity .15s;
}
.cb-row:hover{opacity:.8}
.cb-row.checked{opacity:1}
.cb-box{
  width:18px;height:18px;min-width:18px;
  border:1.5px solid var(--rule2);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .2s;font-size:10px;color:transparent;
}
.cb-row.checked .cb-box{
  background:var(--amber);border-color:var(--amber);
  color:var(--bg);font-weight:700;
}
.cb-lbl{
  font-size:13px;font-weight:400;color:var(--text);
  line-height:1.4;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}

/* ADD CUSTOM */
.add-custom-btn{
  display:flex;align-items:center;gap:10px;width:100%;
  background:none;border:none;border-top:1px solid var(--rule);
  padding:14px 0;cursor:pointer;
  font-family:'Outfit',sans-serif;
  font-size:13px;font-weight:400;color:var(--text3);
  transition:color .2s;margin-top:4px;text-align:left;
}
.add-custom-btn:hover{color:var(--text)}
.add-custom-plus{font-size:18px;font-weight:200;color:var(--amber)}

/* CUSTOM FORM */
.custom-form{
  border-top:1px solid var(--rule);
  padding:16px 0;margin-bottom:4px;
}
.custom-form-title{
  font-size:9px;font-weight:500;letter-spacing:3px;
  text-transform:uppercase;color:var(--text3);margin-bottom:14px;
}
.custom-name-inp{
  width:100%;border:none;
  border-bottom:1px solid var(--rule2);background:none;
  font-family:'Outfit',sans-serif;
  font-size:20px;font-weight:500;color:var(--text);
  outline:none;padding:4px 0 8px;margin-bottom:14px;

.add-set-btn{

  color:var(--text3);cursor:pointer;transition:color .2s;
  margin-bottom:6px;text-align:left;
}
.add-set-btn:hover{color:var(--amber)}

/* CONTEXT MENU */
.ctx-overlay{position:fixed;inset:0;z-index:300;background:transparent;display:none}
.ctx-menu{
  position:fixed;background:var(--bg2);
  border:1px solid var(--rule2);
  padding:6px 0;z-index:301;min-width:180px;
  box-shadow:0 12px 40px rgba(0,0,0,0.7);
  display:none;animation:ctxIn .12s ease;
}
@keyframes ctxIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.ctx-item{
  padding:11px 16px;font-family:'Outfit',sans-serif;
  font-size:13px;font-weight:400;
  color:var(--text2);cursor:pointer;transition:background .1s;

}
.ctx-item:hover{background:var(--bg1);color:var(--text)}
.ctx-item.danger{color:#c47070}
.ctx-item.danger:hover{background:rgba(196,84,58,.08);color:#d48080}
.ctx-sep{height:1px;background:var(--rule);margin:4px 0}
.rename-inp{
  background:transparent;border:none;
  border-bottom:1px solid var(--amber);
  color:var(--amber);font-family:'Outfit',sans-serif;
  font-size:15px;font-weight:500;
  outline:none;width:100%;padding:2px 0;
}

/* FINISH BAR */
.finish-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(13,13,12,.97);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--rule);
  padding:14px 24px;display:none;gap:10px;z-index:100;
}
.btn-finish{
  flex:1;background:var(--amber);color:var(--bg);border:none;
  padding:15px;font-family:'Outfit',sans-serif;

  text-transform:uppercase;cursor:pointer;transition:opacity .15s;
}
.btn-finish:hover{opacity:.85}
.btn-reset{
  background:none;border:1px solid var(--rule2);color:var(--text3);
  padding:15px 18px;font-family:'Outfit',sans-serif;
  font-size:11px;letter-spacing:1.5px;
  text-transform:uppercase;cursor:pointer;transition:all .15s;
}
.btn-reset:hover{border-color:var(--warn);color:var(--warn)}

/* MODALS */
.modal-ov{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  backdrop-filter:blur(10px);z-index:200;
  display:none;align-items:flex-end;justify-content:center;

}
.modal-ov.show{display:flex;opacity:1;pointer-events:all}
.modal{
  background:var(--bg1);
  border-top:1px solid var(--rule2);
  padding:32px 24px 44px;
  max-width:480px;width:100%;

  transition:transform .35s cubic-bezier(.16,1,.3,1);
}
.modal-ov.show .modal{transform:translateY(0)}
.modal-eye{
  font-size:10px;font-weight:500;letter-spacing:3px;
  text-transform:uppercase;color:var(--text3);margin-bottom:8px;
}
.modal-title{
  font-size:40px;font-weight:700;letter-spacing:-1.5px;
  line-height:1.0;margin-bottom:24px;color:var(--text);
}
.modal-stats{
  display:flex;gap:0;
  border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule);

}
.modal-stat{flex:1;padding:16px 0}
.modal-stat:first-child{border-right:1px solid var(--rule);padding-right:20px}
.modal-stat:last-child{padding-left:20px}
.modal-stat-val{font-size:36px;font-weight:700;letter-spacing:-1.5px;color:var(--amber);line-height:1}
.modal-stat-lbl{font-size:10px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-top:4px}
.modal-quote{padding:18px 0;border-bottom:1px solid var(--rule);margin-bottom:20px}
.modal-qt{font-size:14px;font-weight:300;font-style:italic;line-height:1.7;color:var(--text2)}
.modal-qa{font-size:10px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-top:8px}
.modal-copy-btn{
  width:100%;background:none;border:1px solid var(--rule2);
  color:var(--text2);padding:13px;
  font-family:'Outfit',sans-serif;font-size:11px;font-weight:500;
  letter-spacing:2px;text-transform:uppercase;cursor:pointer;

}
.modal-copy-btn:hover,.modal-copy-btn.copied{border-color:var(--amber);color:var(--amber)}
.modal-close{
  width:100%;background:var(--amber);color:var(--bg);border:none;
  padding:15px;font-family:'Outfit',sans-serif;
  font-size:11px;font-weight:600;letter-spacing:2.5px;
  text-transform:uppercase;cursor:pointer;transition:opacity .15s;
}
.modal-close:hover{opacity:.85}
.modal-resume{
  width:100%;background:none;border:1px solid var(--rule2);
  color:var(--text2);padding:13px;
  font-family:'Outfit',sans-serif;font-size:11px;font-weight:400;
  letter-spacing:2px;text-transform:uppercase;cursor:pointer;
  transition:all .2s;margin-bottom:8px;
}
.modal-resume:hover{border-color:var(--text2);color:var(--text)}
.modal-confirm-summary{
  font-size:13px;font-weight:300;color:var(--text2);
  margin-bottom:20px;line-height:1.7;
  padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
}

/* HISTORY */
.hist-entry{
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:16px 0;border-bottom:1px solid var(--rule);
  cursor:pointer;transition:opacity .15s;
  animation:rise .2s ease;
}
.hist-entry:first-child{border-top:1px solid var(--rule)}
.hist-entry:hover{opacity:.7}
.h-date{
  font-size:10px;font-weight:500;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--text3);margin-bottom:4px;
}
.h-name{font-size:14px;font-weight:500;color:var(--text);letter-spacing:-0.2px}
.h-tap{font-size:10px;color:var(--text3);margin-top:3px;font-weight:300}
.h-right{text-align:right}
.h-stat{font-size:28px;font-weight:700;letter-spacing:-1px;color:var(--amber);line-height:1}
.h-sub{font-size:11px;color:var(--text3);margin-top:3px;font-weight:300}
.empty-state{font-size:14px;font-weight:300;color:var(--text3);padding:32px 0;font-style:italic;text-align:center}

/* HISTORY DETAIL */
#histModal{align-items:flex-end}
#histModalContent{
  background:var(--bg1);border-top:1px solid var(--rule2);
  width:100%;max-width:480px;max-height:90vh;
  overflow-y:auto;padding-bottom:32px;
  transform:translateY(40px);
  transition:transform .35s cubic-bezier(.16,1,.3,1);
}
#histModal.show #histModalContent{transform:translateY(0)}
.hd-header{padding:24px 24px 20px;border-bottom:1px solid var(--rule);position:relative}
.hd-close{
  position:absolute;top:20px;right:20px;

  border:1px solid var(--rule2);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:13px;color:var(--text3);transition:all .2s;
}
.hd-close:hover{color:var(--text);border-color:var(--text3)}
.hd-eye{font-size:9px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.hd-title{font-size:28px;font-weight:700;letter-spacing:-1px;color:var(--text);margin-bottom:6px}
.hd-meta{font-size:12px;font-weight:300;color:var(--text3);margin-bottom:2px}
.hd-checkin{margin:14px 24px 0;padding:10px 0;border-top:1px solid var(--rule);font-size:12px;font-weight:300;color:var(--text2);font-style:italic;line-height:1.6}
.hd-group{padding:16px 24px 0}
.hd-group-title{font-size:9px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--amber);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.hd-ex{padding:10px 0;border-bottom:1px solid var(--rule)}

.hd-sets{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:3px}
.hd-set-chip{font-size:11px;font-weight:300;color:var(--text2);background:var(--bg2);border:1px solid var(--rule);padding:2px 7px}
.hd-note{font-size:11px;font-weight:300;color:var(--text3);font-style:italic;margin-top:3px}
.hd-actions{padding:14px 24px 0;display:flex;flex-direction:column;gap:6px}
.hd-continue-btn{width:100%;background:none;border:1px solid var(--rule2);color:var(--text2);padding:11px;font-family:'Outfit',sans-serif;font-size:11px;font-weight:400;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .2s}

.hd-copy-btn{width:100%;background:var(--amber);color:var(--bg);border:none;padding:11px;font-family:'Outfit',sans-serif;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:opacity .15s}
.hd-copy-btn:hover{opacity:.85}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--rule2)}
</style>

<body>
<div class="app">
  <div class="header">
    <div class="header-eye">Trening</div>
    <div class="header-title">Good to see<br>you, <em>athlete.</em></div>
    <div class="header-date" id="headerDate"></div>
  </div>

  <nav class="nav">
    <button class="nav-btn active" onclick="showPage('home',this)">Home</button>
    <button class="nav-btn" onclick="showPage('session',this)">Session</button>
    <button class="nav-btn" onclick="showPage('history',this)">History</button>
  </nav>

  <!-- HOME -->
  <div class="page active" id="page-home">
    <div class="quote-wrap" onclick="cycleQuote()">
      <div class="quote-text" id="quoteText"></div>
      <div class="quote-source" id="quoteAuthor"></div>
      <div class="quote-cycle">↻</div>
    </div>

    <div class="stats-row">
      <div class="stat-cell">
        <div class="stat-label">This Year</div>
        <span class="stat-num" id="yearSessions" onclick="editGoalNum('year')">40</span>
        <div class="stat-unit">sessions</div>
      </div>
      <div class="stat-cell">
        <div class="stat-label">This Month</div>
        <span class="stat-num" id="goalSessions" onclick="editGoalNum('month')">5</span>
        <div class="stat-unit">sessions</div>
      </div>
    </div>

    <div class="weight-row">
      <span class="weight-label">Weight</span>
      <input class="weight-inp" type="number" id="currentWeight" placeholder="—" step="0.5" oninput="updateWeightGoal()">
      <span class="weight-unit">kg</span>
      <span class="weight-gap" id="weightGap"></span>
      <span class="weight-goal">Goal 75 kg</span>
    </div>

    <div class="last-sess">
      <div class="last-label">Last Session</div>
      <div class="last-body" id="lastBody">No sessions logged yet.</div>
    </div>
  </div>

  <!-- SESSION -->
  <div class="page" id="page-session">

        <div class="stab-sub">Incline · Core</div>
      </button>
      <button class="sess-tab" onclick="selectSess('B',this)">
        <div class="stab-name">Bridge 4</div>
        <div class="stab-sub">Flat · Back</div>
      </button>
      <button class="sess-tab" onclick="selectSess('C',this)">
        <div class="stab-name">Hathsin</div>
        <div class="stab-sub">Zone 2</div>
      </button>
      <button class="sess-tab" onclick="selectSess('D',this)">
        <div class="stab-name">Sylphrena</div>
        <div class="stab-sub">Freestyle</div>
      </button>
    </div>
    <div id="sessContent"></div>
  </div>

  <!-- HISTORY -->
  <div class="page" id="page-history">
    <div id="histList"></div>
  </div>
</div>

<div class="finish-bar" id="finishBar">
  <button class="btn-reset" onclick="resetSess()">Reset</button>
  <button class="btn-finish" onclick="confirmFinish()">Complete Session</button>
</div>

<div class="modal-ov" id="confirmModal" onclick="closeConfirm()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-eye">Are you sure?</div>
    <div class="modal-title">Complete<br>Session?</div>
    <div class="modal-confirm-summary" id="confirmSummary"></div>
    <button class="modal-close" style="margin-bottom:8px" onclick="doFinish()">Yes, Complete Session</button>
    <button class="modal-resume" onclick="closeConfirm()">↩ Continue Session</button>
  </div>
</div>

<div class="modal-ov" id="modal">
  <div class="modal">
    <div class="modal-eye" id="modalEye"></div>
    <div class="modal-title">Session<br>Complete.</div>
    <div class="modal-stats" id="modalStats"></div>
    <div class="modal-quote">
      <div class="modal-qt" id="modalQt"></div>
      <div class="modal-qa" id="modalQa"></div>
    </div>
    <button class="modal-resume" onclick="resumeSession()">↩ Resume Session</button>
    <button class="modal-copy-btn" id="copyBtn" onclick="copySummary()"><span>⎘</span> Copy Session Summary</button>
    <button class="modal-close" onclick="closeModal()">Back to Home</button>
  </div>
</div>

<div class="modal-ov" id="histModal" onclick="closeHistModal()">
  <div id="histModalContent" onclick="event.stopPropagation()"></div>
</div>

<div class="ctx-overlay" id="ctxOverlay" onclick="closeCtx()"></div>
<div class="ctx-menu" id="ctxMenu"></div>

// ── STATE ─────────────────────────────────────────────────────────────
let curSess='A',sessStart=null,qIdx=0;
let setData={},wuData={},cbData={},cbWarmup={},notes={},skipped={},renames={},sessionOrder={},customExs=[],checkinText='';
let history=[],lastW={},lastR={},lastSessData=null;

function load(){
  try{history=JSON.parse(localStorage.getItem('tlog_h')||'[]');}catch(e){}
  try{const x=localStorage.getItem('tlog_lw');if(x)lastW=JSON.parse(x);}catch(e){}
  try{const x=localStorage.getItem('tlog_lr');if(x)lastR=JSON.parse(x);}catch(e){}
}
function save(){
  try{localStorage.setItem('tlog_h',JSON.stringify(history.slice(0,60)));}catch(e){}
  try{localStorage.setItem('tlog_lw',JSON.stringify(lastW));}catch(e){}
  try{localStorage.setItem('tlog_lr',JSON.stringify(lastR));}catch(e){}
}
function getSeed(key,def){try{const v=localStorage.getItem('tlog_seed_'+key);return v!==null?parseFloat(v):def;}catch(e){return def;}}
function saveSeed(key,val){try{localStorage.setItem('tlog_seed_'+key,String(val));}catch(e){}}

// ── INIT ──────────────────────────────────────────────────────────────
function init(){
  load();
  document.getElementById('headerDate').textContent=
    new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  qIdx=Math.floor(Math.random()*QUOTES.length);
  renderQuote();updateHomeStats();initSessState('A');renderSessContent();
  setupLongPress();
}

function renderQuote(){
  const q=QUOTES[qIdx];
  document.getElementById('quoteText').textContent='\u201C'+q.t+'\u201D';
  document.getElementById('quoteAuthor').textContent=q.a;
}
function cycleQuote(){
  const el=document.getElementById('quoteText');el.style.opacity='0';
  setTimeout(()=>{qIdx=(qIdx+1)%QUOTES.length;renderQuote();el.style.opacity='1';},200);
}

// ── HOME ──────────────────────────────────────────────────────────────

function editBenchCurrent(){
  const span=document.getElementById('btCurrent');
  const cur=span.textContent;
  const inp=document.createElement('input');
  inp.type='number';inp.className='bt-current-inp';inp.value=cur;inp.step='0.5';inp.min='0';
  inp.onclick=e=>e.stopPropagation();
  inp.onblur=()=>{
    const v=parseFloat(inp.value);
    if(!isNaN(v)){saveSeed('benchBest',v);}
    span.style.display='';inp.replaceWith(span);};
  inp.onkeydown=e=>{if(e.key==='Enter'||e.key==='Escape')inp.blur();};
  span.style.display='none';span.parentNode.insertBefore(inp,span);
  setTimeout(()=>{inp.focus();inp.select();},30);
}

function editGoalNum(type){
  const idMap={year:'yearSessions',month:'goalSessions'};
  const wrapMap={year:'yearNumWrap',month:'monthNumWrap'};
  const span=document.getElementById(idMap[type]);
  const cur=span.textContent;
  const inp=document.createElement('input');
  inp.type='number';inp.className='goal-num-inp';inp.value=cur;inp.min='0';inp.step='1';
  inp.onblur=()=>{
    const v=parseInt(inp.value);
    if(!isNaN(v)){
      const now=new Date();
      const dynCount=type==='year'
        ?history.filter(h=>new Date(h.date).getFullYear()===now.getFullYear()).length
        :history.filter(h=>{const d=new Date(h.date);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();}).length;
      saveSeed('seed_'+type,v-dynCount);
    }
    updateHomeStats();
  };
  inp.onkeydown=e=>{if(e.key==='Enter'||e.key==='Escape')inp.blur();};
  const wrap=document.getElementById(wrapMap[type]);
  wrap.innerHTML='';wrap.appendChild(inp);
  setTimeout(()=>{inp.focus();inp.select();},30);
}

function updateHomeStats(){
  const now=new Date();
  const yearDyn=history.filter(h=>new Date(h.date).getFullYear()===now.getFullYear()).length;
  const monthDyn=history.filter(h=>{const d=new Date(h.date);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();}).length;
  const yearSeed=getSeed('seed_year',40);
  const monthSeed=getSeed('seed_month',5);
  const yearEl=document.getElementById('yearSessions');
  const monthEl=document.getElementById('goalSessions');
  if(yearEl){yearEl.textContent=yearSeed+yearDyn;}
  if(monthEl){monthEl.textContent=monthSeed+monthDyn;}
  if(history.length){
    const last=history[0],d=new Date(last.date);
    document.getElementById('lastBody').innerHTML=
      '<strong>'+last.label+'</strong><br>'+
      d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})+
      ' &nbsp;\u00b7&nbsp; '+last.done+'/'+last.total+' exercises'+
      ' &nbsp;\u00b7&nbsp; '+(last.duration||'—')+' min';
  }
}
function updateWeightGoal(){
  const v=parseFloat(document.getElementById('currentWeight').value)||null;
  const el=document.getElementById('weightGap');
  if(!v){el.textContent='';return;}
  const d=(75-v).toFixed(1);
  el.textContent=d>0?'+'+d+' kg to go':'✓ Reached';
}

// ── NAV ───────────────────────────────────────────────────────────────
function showPage(page,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');btn.classList.add('active');
  document.getElementById('finishBar').style.display=page==='session'?'flex':'none';
  if(page==='history')renderHistory();
  if(page==='home')updateHomeStats();
}

// ── SESSION STATE ─────────────────────────────────────────────────────
function initSessState(s){
  setData={};notes={};wuData={};cbData={};cbWarmup={};skipped={};renames={};sessionOrder={};customExs=[];checkinText='';
  const sess=SESSIONS[s];
  sess.groups.forEach(g=>g.exercises.forEach(ex=>{
    if(ex.type==='warmup'){const mv={};ex.metrics.forEach(m=>{mv[m.id]=m.val;});wuData[ex.id]={metrics:mv,done:false};}
    else if(ex.type==='checkbox'){cbData[ex.id]=false;}
    else{
      const dw=lastW[ex.id]!==undefined?lastW[ex.id]:ex.dw;
      const dr=lastR[ex.id]!==undefined?lastR[ex.id]:ex.dr;
      setData[ex.id]=Array.from({length:ex.sets},()=>({w:dw,r:dr,logged:false}));
      notes[ex.id]='';
      if(ex.warmupSet)cbWarmup[ex.id]=false;
    }
  }));
}
function selectSess(s,btn){
  curSess=s;sessStart=new Date();initSessState(s);
  document.querySelectorAll('.sess-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
  renderSessContent();
}

function getLastSessSets(exId){
  const prev=history.find(h=>h.session===curSess);
  if(!prev||!prev.log||!prev.log[exId]||!prev.log[exId].sets)return null;
  return prev.log[exId].sets;
}
function getLastSessNote(exId){
  const prev=history.find(h=>h.session===curSess);
  if(!prev||!prev.log||!prev.log[exId])return'';
  return prev.log[exId].note||'';
}
function fmtSet(s){
  if(s.w&&s.w!=='—'&&s.w!=='BW'&&s.r&&s.r!=='—')return s.r+' / '+s.w+' kg';
  if(s.r&&s.r!=='—')return s.r+' reps';
  return'—';
}

// ── RENDER SESSION ────────────────────────────────────────────────────
function getOrderedGroups(){
  const sess=SESSIONS[curSess];
  return sess.groups.map((grp,gi)=>{
    const exOrder=sessionOrder[gi]||grp.exercises.map((_,i)=>i);
    return{...grp,exercises:exOrder.map(i=>grp.exercises[i])};
  });
}

function renderSessContent(){
  if(!sessStart)sessStart=new Date();
  const groups=getOrderedGroups();
  let html='';
  html+='<div class="checkin-wrap">'
    +'<div class="checkin-head"><div class="checkin-dot"></div><span class="checkin-title">Check-in</span><span class="checkin-hint">How are you feeling?</span></div>'
    +'<div class="checkin-body"><div class="checkin-prompts">Energy · Sleep · Hunger · Headache · Time of day</div>'
    +'<textarea class="checkin-area" id="checkinArea" placeholder="e.g. Tired, slept 6h, ate well, 17:30…" oninput="saveCheckin()">'+esc(checkinText)+'</textarea>'
    +'</div></div>';
  groups.forEach((grp,gi)=>{
    html+='<div class="block-sec"><div class="block-title">'+grp.title+'</div>';
    if(grp.superset){
      html+='<div class="superset-wrap"><div class="superset-tag">Superset. No rest between exercises.</div>';
      grp.exercises.forEach(ex=>{html+=renderExAny(ex,gi);});
      html+='</div>';
    }else{grp.exercises.forEach(ex=>{html+=renderExAny(ex,gi);});}
    html+='</div>';
  });
  if(customExs.length){
    html+='<div class="block-sec"><div class="block-title">Additional Exercises</div>';
    customExs.forEach(cx=>{html+=renderCustomEx(cx);});
    html+='</div>';
  }
  html+='<button class="add-custom-btn" onclick="showCustomForm()"><span class="add-custom-plus">+</span> Add Custom Exercise</button>';
  html+='<div id="customFormArea"></div>';
  document.getElementById('sessContent').innerHTML=html;
}
function saveCheckin(){const el=document.getElementById('checkinArea');if(el)checkinText=el.value;}

function renderExAny(ex,gi){
  if(ex.type==='warmup')return renderWarmup(ex);
  if(ex.type==='checkbox')return renderCheckbox(ex);
  return renderEx(ex,gi);
}

function renderWarmup(ex){
  const d=wuData[ex.id]||{metrics:{},done:false};
  let mHtml='';
  ex.metrics.forEach(m=>{
    const v=d.metrics[m.id]!==undefined?d.metrics[m.id]:m.val;
    mHtml+='<div class="wu-metric"><div class="wu-metric-lbl">'+m.label+'</div>'
      +'<div class="wu-stepper">'
      +'<button class="wu-step-btn" onclick="adjWu(\''+ex.id+'\',\''+m.id+'\',-1,'+m.step+','+m.min+','+m.max+',event)">−</button>'
      +'<span class="wu-step-val" id="wuv_'+ex.id+'_'+m.id+'">'+v+'</span>'
      +'<button class="wu-step-btn" onclick="adjWu(\''+ex.id+'\',\''+m.id+'\',1,'+m.step+','+m.min+','+m.max+',event)">+</button>'
      +'</div><div class="wu-metric-unit">'+m.unit+'</div></div>';
  });
  const ts=d.done?'background:var(--gold);border-color:var(--gold);color:#0a0f18;font-weight:700':'';
  const tick='<div class="ex-row-check" style="'+ts+'">'+(d.done?'✓':'')+'</div>';
  return '<div class="warmup-card'+(d.done?' done':'')+'" id="wu_'+ex.id+'">'
    +'<div class="wu-head" onclick="toggleWu(\''+ex.id+'\')" style="cursor:pointer">'+tick+'<div class="wu-title">'+ex.name+'</div></div>'
    +'<div class="wu-body"><div class="wu-metrics">'+mHtml+'</div>'
    +'</div></div>';
}

function renderCheckbox(ex){
  const checked=cbData[ex.id]||false;
  const breathTag=ex.breath?'<span class="ex-tag-breath" style="margin-left:8px">Breath</span>':'';
  return '<div class="cb-row'+(checked?' checked':'')+'" onclick="toggleCb(\''+ex.id+'\')" id="cb_'+ex.id+'">'
    +'<div class="cb-box">'+(checked?'✓':'')+'</div>'
    +'<div class="cb-lbl">'+ex.name+breathTag+'</div>'
    +'</div>';
}

function renderEx(ex,gi){
  const sd=setData[ex.id]||[];
  const isSkipped=!!skipped[ex.id];
  const done=!isSkipped&&sd.length>0&&sd.every(s=>s.logged);
  const loggedCount=sd.filter(s=>s.logged).length;
  const displayName=renames[ex.id]||ex.name;
  const isRenamed=!!renames[ex.id];

  let summaryHtml='';
  if(isSkipped)summaryHtml='<span style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);background:rgba(90,116,148,0.12);border:1px solid var(--skipped-border);padding:2px 8px;border-radius:10px">Skipped</span>';
  else if(loggedCount>0)summaryHtml='<div class="ex-row-summary">'+loggedCount+'/'+ex.sets+'</div>';

  const lastSets=getLastSessSets(ex.id);
  let lastSetsHtml='';
  if(lastSets&&lastSets.length){
    const chips=lastSets.map((s,i)=>'<div class="prev-chip">S'+(i+1)+': '+(s.logged?fmtSet(s):'—')+'</div>').join('');
    lastSetsHtml='<div class="prev-block"><div class="prev-label">Last session</div><div class="prev-chips">'+chips+'</div></div>';
  }
  const lastNote=getLastSessNote(ex.id);
  const lastNoteHtml=lastNote?'<div class="prev-note">Last session note: '+esc(lastNote)+'</div>':'';

  let warmupSetHtml='';
  if(ex.warmupSet){
    const wuChecked=cbWarmup[ex.id]||false;
    warmupSetHtml='<div class="wu-set-row">'
      +'<div class="wu-set-cb'+(wuChecked?' checked':'')+'" onclick="toggleWarmupSet(\''+ex.id+'\')">'+(wuChecked?'✓':'')+'</div>'
      +'<span class="wu-set-label">Warm-up set</span>'
      +'<span class="wu-set-weight">20 kg. Barbell only.</span>'
      +'</div>';
  }

  let abbyHtml='';
  if(ex.abbyNote){
    abbyHtml='<div class="abby-note"><span class="abby-note-label">Abby:</span><span class="abby-note-text">'+esc(ex.abbyNote)+'</span></div>';
  }

  let setsHtml='<div class="sets-label">Sets</div><div class="sets-list">';
  sd.forEach((s,i)=>{setsHtml+=renderSetRow(ex,i,s);});
  setsHtml+='</div>';

  const curNote=notes[ex.id]||'';
  const noteHtml='<div class="note-label">Notes</div><textarea class="note-inp" id="note_'+ex.id+'" placeholder="Add a note…" oninput="saveNote(\''+ex.id+'\')">'+esc(curNote)+'</textarea>';
  const coachHtml=ex.note?'<div class="coach-note">'+ex.note+'</div>':'';

  let tags='';
  if(ex.rehab)tags+='<span class="ex-tag-rehab">Back rehab</span>';
  if(ex.breath)tags+='<span class="ex-tag-breath">Breath</span>';

  const skipToggle='<button class="skip-btn" onclick="toggleSkip(\''+ex.id+'\',event)">'+(isSkipped?'↩':'Skip')+'</button>';

  let cardClass='ex-row'+(done?' done':isSkipped?' skipped':'');

  const nameHtml='<span class="ex-name'+(isRenamed?' ex-name-renamed':'')+'" id="exname_'+ex.id+'">'+esc(displayName)+'</span>';

  return '<div class="'+cardClass+'" id="ec_'+ex.id+'">'
    +'<div class="ex-row-head">'
    +'<div class="ex-row-check" onclick="'+(isSkipped?'toggleSkip(\''+ex.id+'\',event)':'toggleExHead(\''+ex.id+'\')')+'">'+( done?'✓':isSkipped?'✕':'')+'</div>'
    +'<div class="ex-row-info" onclick="toggleExHead(\''+ex.id+'\')">'
    +nameHtml+(ex.prescription?'<div class="ex-row-presc">'+ex.prescription+'</div>':'')+'</div>'
    +(tags?'<div class="ex-tags">'+tags+'</div>':'')
    +summaryHtml
    +skipToggle
    +'</div>'
    +(isSkipped?'':'<div class="ex-row-body">'+lastSetsHtml+lastNoteHtml+warmupSetHtml+abbyHtml+setsHtml+noteHtml+coachHtml+'</div>')
    +'</div>';
}

function renderSetRow(ex,i,s){
  const canW=!ex.noStep&&!ex.noStepW&&s.w!=='—'&&s.w!=='BW';
  const canR=!ex.noStep&&s.r!=='—';
  const rCtrl=canR
    ?'<div class="set-group"><button class="set-btn" onclick="adjSet(\''+ex.id+'\','+i+',\'r\',-1,event)">−</button><span class="set-val" id="sv_r_'+ex.id+'_'+i+'" onclick="openInlineEdit(\'sv_r_'+ex.id+'_'+i+'\',\'r\',event)">'+s.r+'</span><button class="set-btn" onclick="adjSet(\''+ex.id+'\','+i+',\'r\',1,event)">+</button></div><span class="set-unit">reps</span>'
    :'<span style="font-size:13px;color:var(--muted);padding:0 5px">'+s.r+'</span>';
  const wCtrl=canW
    ?'<div class="set-group"><button class="set-btn" onclick="adjSet(\''+ex.id+'\','+i+',\'w\',-1,event)">−</button><span class="set-val" id="sv_w_'+ex.id+'_'+i+'" onclick="openInlineEdit(\'sv_w_'+ex.id+'_'+i+'\',\'w\',event)">'+s.w+'</span><button class="set-btn" onclick="adjSet(\''+ex.id+'\','+i+',\'w\',1,event)">+</button></div><span class="set-unit">kg</span>'
    :'<span style="font-size:13px;color:var(--muted);padding:0 5px">'+s.w+'</span>';
  const logBtn=s.logged
    ?'<button class="log-btn" onclick="unlogSet(\''+ex.id+'\','+i+',event)">✓</button>'
    :'<button class="log-btn" onclick="logSet(\''+ex.id+'\','+i+',event)">I did it</button>';
  return '<div class="set-row'+(s.logged?' set-logged':'')+'" id="sr_'+ex.id+'_'+i+'">'
    +'<span class="set-n">S'+(i+1)+'</span>'
    +'<div class="set-ctrl">'+rCtrl+'<span class="set-sep">/</span>'+wCtrl+'</div>'
    +logBtn+'</div>';
}

// ── INLINE EDIT ───────────────────────────────────────────────────────
function openInlineEdit(spanId,type,e){
  e.stopPropagation();
  const span=document.getElementById(spanId);if(!span)return;
  const cur=span.textContent;
  const inp=document.createElement('input');
  inp.type='number';inp.className='set-step-inp';inp.value=cur;inp.step=type==='w'?'0.5':'1';inp.min='0';
  inp.onclick=ev=>ev.stopPropagation();
  inp.onblur=()=>{
    const v=parseFloat(inp.value);
    span.textContent=isNaN(v)?cur:(Number.isInteger(v)?String(v):v.toFixed(1));
    span.style.display='';inp.replaceWith(span);
  };
  inp.onkeydown=ev=>{if(ev.key==='Enter'||ev.key==='Escape')inp.blur();};
  span.style.display='none';span.parentNode.insertBefore(inp,span);
  setTimeout(()=>{inp.focus();inp.select();},30);
}

// ── EXERCISE INTERACTIONS ─────────────────────────────────────────────
function adjWu(exId,mId,dir,step,min,max,e){
  e.stopPropagation();const d=wuData[exId];if(!d)return;
  let v=parseFloat(d.metrics[mId])||0;
  v=Math.max(min,Math.min(max,v+dir*step));
  d.metrics[mId]=String(Math.round(v));
  const el=document.getElementById('wuv_'+exId+'_'+mId);if(el)el.textContent=d.metrics[mId];
}
function toggleWu(exId){
  const d=wuData[exId];if(!d)return;d.done=!d.done;
  const card=document.getElementById('wu_'+exId);if(!card)return;
  const ex=findEx(exId);if(!ex)return;
  const tmp=document.createElement('div');tmp.innerHTML=renderWarmup(ex);card.replaceWith(tmp.firstElementChild);
}
function toggleCb(exId){
  cbData[exId]=!cbData[exId];
  const el=document.getElementById('cb_'+exId);if(!el)return;
  const ex=findEx(exId);if(!ex)return;
  const tmp=document.createElement('div');tmp.innerHTML=renderCheckbox(ex);el.replaceWith(tmp.firstElementChild);
}
function toggleWarmupSet(exId){cbWarmup[exId]=!cbWarmup[exId];refreshEx(exId);}
function toggleSkip(exId,e){e.stopPropagation();skipped[exId]=!skipped[exId];refreshEx(exId);}
function adjSet(exId,i,type,dir,e){
  e.stopPropagation();if(!setData[exId])return;
  const s=setData[exId][i];const ex=findEx(exId);if(!ex)return;
  if(type==='w'){
    let v=parseFloat(s.w)||0;v=Math.max(0,v+dir);
    s.w=Number.isInteger(v)?String(v):v.toFixed(1);
    const el=document.getElementById('sv_w_'+exId+'_'+i);if(el)el.textContent=s.w;
  }else{
    let v=parseInt(s.r)||0;v=Math.max(0,v+dir);s.r=String(v);
    const el=document.getElementById('sv_r_'+exId+'_'+i);if(el)el.textContent=s.r;
  }

function logSet(exId,i,e){
  e.stopPropagation();if(!setData[exId])return;
  const wEl=document.getElementById('sv_w_'+exId+'_'+i);
  const rEl=document.getElementById('sv_r_'+exId+'_'+i);
  if(wEl)setData[exId][i].w=wEl.textContent;if(rEl)setData[exId][i].r=rEl.textContent;
  setData[exId][i].logged=true;
  const s=setData[exId][i];
  for(let j=i+1;j<setData[exId].length;j++){if(!setData[exId][j].logged){setData[exId][j].w=s.w;setData[exId][j].r=s.r;}}
  lastW[exId]=s.w;lastR[exId]=s.r;save();refreshEx(exId);
}
function unlogSet(exId,i,e){
  e.stopPropagation();if(!setData[exId])return;
  setData[exId][i].logged=false;refreshEx(exId);
}
function toggleExHead(id){
  if(skipped[id])return;
  const done=setData[id]&&setData[id].every(s=>s.logged);
  const ex=findEx(id);if(!ex)return;
  if(done){setData[id].forEach(s=>s.logged=false);}
  else{setData[id].forEach(s=>s.logged=true);const f=setData[id][0];lastW[id]=f.w;lastR[id]=f.r;save();}
  refreshEx(id);
}
function refreshEx(exId){
  const ex=findEx(exId);if(!ex)return;
  const card=document.getElementById('ec_'+exId);if(!card)return;
  const tmp=document.createElement('div');tmp.innerHTML=renderEx(ex);

}
function saveNote(id){const el=document.getElementById('note_'+id);if(el)notes[id]=el.value;}
function findEx(id){
  let found=null;
  Object.values(SESSIONS).forEach(sess=>sess.groups.forEach(g=>g.exercises.forEach(ex=>{if(ex.id===id)found=ex;})));
  return found;
}

// ── LONG PRESS (rename/reorder) ───────────────────────────────────────
let longPressTimer=null,ctxTarget=null,lpStartX=0,lpStartY=0,lpMoved=false;
function setupLongPress(){
  document.addEventListener('touchstart',onTS,{passive:true});
  document.addEventListener('touchend',onTE,{passive:true});
  document.addEventListener('touchmove',onTM,{passive:true});
  document.addEventListener('mousedown',onMD);
  document.addEventListener('mouseup',onMU);
}
function onTS(e){lpStartX=e.touches[0].clientX;lpStartY=e.touches[0].clientY;lpMoved=false;startLP(e.touches[0].clientX,e.touches[0].clientY,e.target);}
function onTM(e){const dx=e.touches[0].clientX-lpStartX,dy=e.touches[0].clientY-lpStartY;if(Math.abs(dx)>8||Math.abs(dy)>8){lpMoved=true;cancelLP();}}
function onTE(){cancelLP();}
function onMD(e){if(e.button===0)startLP(e.clientX,e.clientY,e.target);}
function onMU(){cancelLP();}
function startLP(x,y,target){
  cancelLP();
  const exCard=target.closest('.ex-card[id^="ec_"]');
  if(!exCard)return;
  longPressTimer=setTimeout(()=>{
    if(lpMoved)return;
    const exId=exCard.id.replace('ec_','');
    const ex=findEx(exId);if(!ex)return;
    ctxTarget={exId,x,y};showCtxMenu(ex,exId,x,y);
  },500);
}
function cancelLP(){if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null;}}
function showCtxMenu(ex,exId,x,y){
  const menu=document.getElementById('ctxMenu');
  const overlay=document.getElementById('ctxOverlay');
  const grpInfo=getExGroupInfo(exId);
  let items='<div class="ctx-item" onclick="ctxRename()">✎ Rename (this session)</div>';
  items+='<div class="ctx-sep"></div>';
  if(grpInfo){
    if(grpInfo.posInGroup>0)items+='<div class="ctx-item" onclick="ctxMove(-1)">↑ Move Up</div>';
    if(grpInfo.posInGroup<grpInfo.groupSize-1)items+='<div class="ctx-item" onclick="ctxMove(1)">↓ Move Down</div>';
  }
  menu.innerHTML=items;
  overlay.style.display='block';
  const menuW=190,menuH=menu.children.length*42;
  menu.style.left=Math.min(x,window.innerWidth-menuW-12)+'px';
  menu.style.top=Math.min(y,window.innerHeight-menuH-12)+'px';
  menu.style.display='block';
}
function closeCtx(){document.getElementById('ctxMenu').style.display='none';document.getElementById('ctxOverlay').style.display='none';ctxTarget=null;}
function ctxRename(){
  if(!ctxTarget)return;
  const{exId}=ctxTarget;closeCtx();
  const nameEl=document.getElementById('exname_'+exId);if(!nameEl)return;
  const current=renames[exId]||findEx(exId).name;
  nameEl.innerHTML='<input class="rename-input" id="ri_'+exId+'" value="'+esc(current)+'" onclick="event.stopPropagation()" onkeydown="renameKey(event,\''+exId+'\')">';
  setTimeout(()=>{const inp=document.getElementById('ri_'+exId);if(inp){inp.focus();inp.select();}},50);
}
function renameKey(e,exId){if(e.key==='Enter')commitRename(exId);if(e.key==='Escape'){renames[exId]=null;refreshEx(exId);}}
function commitRename(exId){
  const inp=document.getElementById('ri_'+exId);if(!inp)return;
  const val=inp.value.trim();
  renames[exId]=val&&val!==findEx(exId).name?val:null;
  refreshEx(exId);
}
function getExGroupInfo(exId){
  const sess=SESSIONS[curSess];
  for(let gi=0;gi<sess.groups.length;gi++){
    const grp=sess.groups[gi];
    const order=sessionOrder[gi]||grp.exercises.map((_,i)=>i);
    const pos=order.findIndex(oi=>grp.exercises[oi].id===exId);
    if(pos>=0)return{gi,pos,posInGroup:pos,groupSize:order.length};
  }
  return null;
}
function ctxMove(dir){
  if(!ctxTarget)return;
  const info=getExGroupInfo(ctxTarget.exId);if(!info)return;
  const{gi,pos}=info;const grp=SESSIONS[curSess].groups[gi];
  if(!sessionOrder[gi])sessionOrder[gi]=grp.exercises.map((_,i)=>i);
  const order=sessionOrder[gi];const newPos=pos+dir;
  if(newPos<0||newPos>=order.length)return;
  [order[pos],order[newPos]]=[order[newPos],order[pos]];
  closeCtx();renderSessContent();
}

// ── FINISH ────────────────────────────────────────────────────────────
function confirmFinish(){
  const sess=SESSIONS[curSess];let total=0,logged=0;
  sess.groups.forEach(g=>g.exercises.forEach(ex=>{
    if(ex.type==='warmup'||ex.type==='checkbox')return;
    total++;const sd=setData[ex.id]||[];
    if(sd.length>0&&sd.every(s=>s.logged))logged++;
  }));
  const pct=total>0?Math.round((logged/total)*100):0;
  document.getElementById('confirmSummary').textContent=logged+' of '+total+' exercises completed ('+pct+'%)';
  document.getElementById('confirmModal').classList.add('show');
}
function closeConfirm(){document.getElementById('confirmModal').classList.remove('show');}

function doFinish(){
  closeConfirm();
  const sess=SESSIONS[curSess];let total=0,done=0;const log={};
  sess.groups.forEach(g=>g.exercises.forEach(ex=>{
    if(ex.type==='warmup'){total++;if((wuData[ex.id]||{}).done)done++;log[ex.id]={type:'warmup',metrics:{...(wuData[ex.id]||{}).metrics},done:(wuData[ex.id]||{}).done,name:ex.name};}
    else if(ex.type==='checkbox'){total++;if(cbData[ex.id])done++;log[ex.id]={type:'checkbox',done:cbData[ex.id]||false,name:ex.name};}
    else{total++;const sd=setData[ex.id]||[];const exDone=!skipped[ex.id]&&sd.length>0&&sd.every(s=>s.logged);if(exDone)done++;
      log[ex.id]={sets:sd.map(s=>({...s})),note:notes[ex.id]||'',name:ex.name,displayName:renames[ex.id]||ex.name,skipped:!!skipped[ex.id],warmupSetDone:cbWarmup[ex.id]||false};}
  }));
  customExs.forEach(cx=>{total++;const exDone=cx.sets.length>0&&cx.sets.every(s=>s.logged);if(exDone)done++;log[cx.id]={sets:cx.sets.map(s=>({...s})),note:cx.note||'',customName:cx.name,isCustom:true,metricType:cx.metricType};});
  const mins=sessStart?Math.round((new Date()-sessStart)/60000):0;
  const now=new Date();
  const yearDyn=history.filter(h=>new Date(h.date).getFullYear()===now.getFullYear()).length;
  const sessNumber=getSeed('seed_year',40)+yearDyn+1;
  const entry={date:now.toISOString(),session:curSess,label:sess.label,sub:sess.sub,done,total,duration:mins,checkin:checkinText,log,sessNumber};
  history.unshift(entry);lastSessData=entry;save();
  const q=QUOTES[Math.floor(Math.random()*QUOTES.length)];
  document.getElementById('modalEye').textContent=now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase();
  document.getElementById('modalStats').innerHTML='<div class="modal-stat"><div class="modal-stat-val">'+done+'/'+total+'</div><div class="modal-stat-lbl">Exercises</div></div><div class="modal-stat"><div class="modal-stat-val">'+(mins||'—')+'</div><div class="modal-stat-lbl">Minutes</div></div>';
  document.getElementById('modalQt').textContent='\u201C'+q.t+'\u201D';
  document.getElementById('modalQa').textContent=q.a;
  const btn=document.getElementById('copyBtn');if(btn){btn.classList.remove('copied');btn.innerHTML='<span>⎘</span> Copy Session Summary';}
  document.getElementById('modal').classList.add('show');
}

// ── CLIPBOARD ─────────────────────────────────────────────────────────
function buildSummaryText(entry){
  const e=entry||lastSessData;if(!e)return'No session data.';
  const d=new Date(e.date);const sess=SESSIONS[e.session];
  let lines=['Treningsøkt #'+(e.sessNumber||'?'),'',
    d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),
    e.label+(e.sub?' — '+e.sub:''),
    'Duration: '+(e.duration||'—')+' min · '+e.done+'/'+e.total+' exercises'];
  if(e.checkin){lines.push('');lines.push('Check-in: '+e.checkin);}
  lines.push('');
  sess.groups.forEach(grp=>{
    lines.push(grp.title.toUpperCase());
    grp.exercises.forEach(ex=>{
      const le=e.log[ex.id];if(!le)return;
      if(ex.type==='warmup'){const mv=le.metrics||{};lines.push((le.done?'✓ ':'○ ')+ex.name+' — Setting '+(mv.setting||'?')+' · '+(mv.duration||'?')+' min · '+(mv.distance||'?')+' m');}
      else if(ex.type==='checkbox'){lines.push((le.done?'✓ ':'○ ')+ex.name);}
      else{if(le.skipped){lines.push('⊘ '+(le.displayName||ex.name)+' (skipped)');return;}
        const sets=(le.sets||[]).filter(s=>s.logged);const doneAll=(le.sets||[]).length>0&&(le.sets||[]).every(s=>s.logged);
        lines.push((doneAll?'✓ ':'○ ')+(le.displayName||ex.name));
        if(le.warmupSetDone)lines.push('  Warm-up: 20 kg × 1 set ✓');
        if(sets.length)lines.push('  '+sets.map((s,i)=>'S'+(i+1)+': '+fmtSet(s)).join(' · '));
        if(le.note)lines.push('  Note: '+le.note);}
    });lines.push('');
  });
  const customs=Object.entries(e.log).filter(([,v])=>v.isCustom);
  if(customs.length){lines.push('ADDITIONAL');customs.forEach(([,v])=>{const sets=(v.sets||[]).filter(s=>s.logged);lines.push(((v.sets||[]).every(s=>s.logged)?'✓ ':'○ ')+(v.customName||'Custom'));if(sets.length)lines.push('  '+sets.map((s,i)=>'S'+(i+1)+': '+fmtSet(s)).join(' · '));if(v.note)lines.push('  Note: '+v.note);});}
  return lines.join('\n');
}
function copySummary(entry){
  const text=buildSummaryText(entry||lastSessData);
  const btn=document.getElementById('copyBtn');
  navigator.clipboard.writeText(text).then(()=>{if(btn){btn.innerHTML='<span>✓</span> Copied';btn.classList.add('copied');}})
  .catch(()=>{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);if(btn){btn.innerHTML='<span>✓</span> Copied';btn.classList.add('copied');}});
}

  // Header
  html+='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">'
    +'<button style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:0" onclick="closeHistModal()">←</button>'
    +'</div>';
  html+='<div class="hd-header">'
    +'<div class="hd-sess-num">'+(h.sessNumber?'Treningsøkt #'+h.sessNumber:'Session')+'</div>'
    +'<div class="hd-title">'+h.label+'</div>'
    +'<div class="hd-sub">'+d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</div>'
    +'<div class="hd-meta">'
    +'<div class="hd-meta-item"><strong>'+h.done+'/'+h.total+'</strong>exercises</div>'
    +'<div class="hd-meta-item"><strong>'+(h.duration||'—')+'</strong>minutes</div>'
    +'</div></div>';
  if(h.checkin){html+='<div class="hd-checkin">'+esc(h.checkin)+'</div>';}
  // Exercises
  sess.groups.forEach(grp=>{
    const grpExs=grp.exercises.filter(ex=>h.log[ex.id]);
    if(!grpExs.length)return;
    html+='<div class="hd-group"><div class="hd-group-title">'+grp.title+'</div>';
    grp.exercises.forEach(ex=>{
      const le=h.log[ex.id];if(!le)return;
      if(ex.type==='warmup'){
        const mv=le.metrics||{};
        html+='<div class="hd-ex'+(le.done?' hd-ex-done':'')+'"><div class="hd-ex-name">'+(le.done?'<div class="hd-ex-check">✓</div>':'')+''+ex.name+'</div>'
          +'<div style="font-size:11px;color:var(--muted)">Setting '+(mv.setting||'?')+' · '+(mv.duration||'?')+' min · '+(mv.distance||'?')+' m</div></div>';
      } else if(ex.type==='checkbox'){
        html+='<div class="hd-ex'+(le.done?' hd-ex-done':'')+'"><div class="hd-ex-name">'+(le.done?'<div class="hd-ex-check">✓</div>':'')+''+ex.name+'</div></div>';
      } else {
        const sets=(le.sets||[]).filter(s=>s.logged);
        const isSkip=le.skipped;
        html+='<div class="hd-ex'+((!isSkip&&sets.length>0&&(le.sets||[]).every(s=>s.logged))?' hd-ex-done':'')+(isSkip?' hd-ex-skipped':'')+'"><div class="hd-ex-name">'
          +(isSkip?'<div class="hd-ex-skip">⊘</div>':sets.length>0&&(le.sets||[]).every(s=>s.logged)?'<div class="hd-ex-check">✓</div>':'')
          +(le.displayName||ex.name)+'</div>';
        if(le.warmupSetDone)html+='<div style="font-size:10px;color:var(--muted);margin-bottom:4px">Warm-up: 20 kg ✓</div>';
        if(sets.length){html+='<div class="hd-sets">'+sets.map((s,i)=>'<div class="hd-set-chip">S'+(i+1)+': '+fmtSet(s)+'</div>').join('')+'</div>';}
        if(le.note)html+='<div class="hd-note">'+esc(le.note)+'</div>';
        html+='</div>';
      }
    });
    html+='</div>';
  });
  // Buttons
  html+='<div style="margin-top:20px;display:flex;flex-direction:column;gap:10px">';
  const copyBtnId='histCopyBtn_'+idx;
  html+='<button class="modal-btn-outline" id="'+copyBtnId+'" onclick="histCopy('+idx+',\''+copyBtnId+'\')"><span>⎘</span> Copy Summary</button>';
  if(isMostRecent){
    html+='<button class="modal-btn-gold" onclick="continueSession('+idx+')">↩ Continue This Session</button>';
  }
  html+='</div>';
  document.getElementById('histModalContent').innerHTML=html;
  document.getElementById('histModal').classList.add('show');
}

function closeHistModal(){document.getElementById('histModal').classList.remove('show');}

function histCopy(idx,btnId){
  const h=history[idx];if(!h)return;
  const text=buildSummaryText(h);
  const btn=document.getElementById(btnId);
  navigator.clipboard.writeText(text).then(()=>{if(btn){btn.innerHTML='<span>✓</span> Copied';btn.classList.add('copied');}})
  .catch(()=>{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);if(btn){btn.innerHTML='<span>✓</span> Copied';btn.classList.add('copied');}});
}

function continueSession(idx){
  // Restore most recent session — remove from history and restore state
  const h=history[idx];if(!h)return;
  // Only allow for most recent
  if(idx!==0)return;
  history.shift();
  try{localStorage.setItem('tlog_h',JSON.stringify(history.slice(0,60)));}catch(e){}
  closeHistModal();
  // Switch to the session tab
  curSess=h.session;sessStart=new Date();
  initSessState(curSess);
  // Restore logged set data from history
  const sess=SESSIONS[curSess];
  sess.groups.forEach(g=>g.exercises.forEach(ex=>{
    if(ex.type==='warmup'&&h.log[ex.id]){wuData[ex.id]={metrics:{...h.log[ex.id].metrics},done:h.log[ex.id].done};}
    else if(ex.type==='checkbox'&&h.log[ex.id]){cbData[ex.id]=h.log[ex.id].done;}
    else if(h.log[ex.id]){
      const le=h.log[ex.id];
      if(le.sets)setData[ex.id]=le.sets.map(s=>({...s}));
      if(le.note)notes[ex.id]=le.note;
      if(le.skipped)skipped[ex.id]=true;
      if(le.warmupSetDone)cbWarmup[ex.id]=true;
      if(le.displayName&&le.displayName!==ex.name)renames[ex.id]=le.displayName;
    }
  }));
  checkinText=h.checkin||'';
  // Navigate to session page
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-session').classList.add('active');
  document.querySelectorAll('.nav-btn')[1].classList.add('active');
  document.getElementById('finishBar').style.display='flex';
  // Select the right tab
  const tabs=document.querySelectorAll('.sess-tab');
  const tabMap={A:0,B:1,C:2,D:3};
  tabs.forEach(t=>t.classList.remove('active'));
  if(tabs[tabMap[curSess]])tabs[tabMap[curSess]].classList.add('active');
  renderSessContent();
  updateHomeStats();
}

// ── PWA ───────────────────────────────────────────────────────────────
(function(){
  if('serviceWorker' in navigator){
    const sw=`const CACHE='trening-v4';self.addEventListener('install',e=>{self.skipWaiting();});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(n=>n!==CACHE).map(n=>caches.delete(n)))));self.clients.claim();});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>new Response('Offline',{status:503}))));});`;
    const b=new Blob([sw],{type:'text/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(b)).catch(()=>{});
  }
})();

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

init();
</script>
